name: Release to Maven Central

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, e.g. 2.0.0'
        required: true
        type: string
      dry_run:
        description: 'Build the signed Central bundle without uploading'
        default: true
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: maven-central-release
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  LANG: C.UTF-8

jobs:
  version:
    name: Check release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.version.outputs.revision }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check tag and POM
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          python3 .github/script/publish_version.py release --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"

  verify:
    name: Verify release
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.version.outputs.commit }}
      revision: ${{ needs.version.outputs.revision }}

  publish:
    name: Sign and publish
    needs: [version, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: maven-central
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          server-id: central
          server-username-env-var: CENTRAL_USERNAME
          server-password-env-var: CENTRAL_TOKEN
      - name: Build signed Central bundle
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          RELEASE_VERSION: ${{ needs.version.outputs.revision }}
          SKIP_UPLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          test -n "$MAVEN_GPG_KEY"
          if [ "$SKIP_UPLOAD" != true ]; then
            test -n "$CENTRAL_USERNAME" && test -n "$CENTRAL_TOKEN"
          fi
          # Runtime compiler failure fixtures are asserted by the tests.
          echo "::remove-matcher owner=javac::"
          ./mvnw -B -ntp -Psign,central "-Drevision=$RELEASE_VERSION" \
            "-Dcentral.skipUpload=$SKIP_UPLOAD" deploy
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: central-bundle-${{ needs.version.outputs.revision }}
          path: target/central-publishing/*.zip
          if-no-files-found: error
          retention-days: 14
